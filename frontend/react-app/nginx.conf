server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 30m;

    # Forward the browser's Host so the backend sees same-origin requests
    # (no CORS preflight, refresh cookies stay first-party).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # STOMP over WebSocket (realtime notifications, support chat).
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: unknown paths are client-side routes.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
