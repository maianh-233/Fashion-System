name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven tests on PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/fashion-system
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: commerce_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Empty database: Flyway builds the schema when the first Spring test context starts.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: commerce_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Test
        run: ./mvnw -B -ntp test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/fashion-system/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/react-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and frontend images
        env:
          JWT_SECRET: ci-only-not-used
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-not-used
        run: docker compose build backend frontend
