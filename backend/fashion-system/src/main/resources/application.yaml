spring:
  application:
    name: fashion-system
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # Flyway owns the schema (db/migration); Hibernate only validates it.
  # V1/V2 are a snapshot of the hand-applied V22..V41 (kept in db/archive), so a
  # database that already has tables but no flyway_schema_history is marked as
  # baselined at V2 instead of being migrated again.
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
    baseline-description: hand-applied migrations up to V41
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        # JJWT still brings Jackson 2 onto the classpath, while Spring Boot 4 and
        # our JSON entity fields use Jackson 3 (tools.jackson.*). Hibernate picks
        # Jackson 2 first when both are present unless the mapper is explicit.
        type:
          json_format_mapper: jackson3
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:500}ms
      timeout: ${REDIS_READ_TIMEOUT_MS:500}ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
  # Spring mặc định 1MB/file: khớp với giới hạn ảnh của storage (ảnh sản phẩm, ảnh đánh giá).
  servlet:
    multipart:
      max-file-size: ${CLOUDINARY_MAX_FILE_SIZE:25MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:30MB}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

mail:
  from-address: ${MAIL_FROM:${MAIL_FROM_ADDRESS:${MAIL_USERNAME:}}}
  from-name: ${MAIL_FROM_NAME:Fashion System}
  otp-subject: ${MAIL_OTP_SUBJECT:Ma OTP dat lai mat khau}

storage:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    max-file-size: ${CLOUDINARY_MAX_FILE_SIZE:25MB}

password-reset:
  otp-expiration-minutes: ${PASSWORD_RESET_OTP_EXPIRATION_MINUTES:5}
  customer-otp-expiration-minutes: ${PASSWORD_RESET_CUSTOMER_OTP_EXPIRATION_MINUTES:1}
  reset-token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:10}
  max-otp-attempts: ${PASSWORD_RESET_MAX_OTP_ATTEMPTS:5}
  resend-cooldown-seconds: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:60}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}

# "Báo khi có hàng": chu kỳ quét các đăng ký chờ có hàng online trở lại.
stock-alert:
  check-ms: ${STOCK_ALERT_CHECK_MS:120000}

# Tài khoản SUPER_ADMIN đầu tiên cho database mới; bỏ trống thì không tạo.
bootstrap:
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

auth:
  max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
  login-lock-duration-seconds: ${AUTH_LOGIN_LOCK_DURATION_SECONDS:60}
  refresh-token:
    expiration: ${AUTH_REFRESH_TOKEN_EXPIRATION:7d}
    cookie-name: ${AUTH_REFRESH_COOKIE_NAME:lunaria_refresh_token}
    cookie-path: ${AUTH_REFRESH_COOKIE_PATH:/api/auth}
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
  customer-refresh-token:
    expiration: ${AUTH_CUSTOMER_REFRESH_TOKEN_EXPIRATION:7d}
    cookie-name: ${AUTH_CUSTOMER_REFRESH_COOKIE_NAME:lunaria_customer_refresh_token}
    cookie-path: ${AUTH_CUSTOMER_REFRESH_COOKIE_PATH:/api/auth/customer}
    secure: ${AUTH_CUSTOMER_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_CUSTOMER_REFRESH_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Tài liệu API (Swagger UI tại /swagger-ui.html). Tắt mặc định, bật bằng API_DOCS_ENABLED=true
# ở môi trường dev/demo; khi tắt, /v3/api-docs và /swagger-ui trả 404.
springdoc:
  # Tách Pageable thành page/size/sort riêng; nếu không Swagger gửi sort=["string"] và API trả 400.
  default-flat-param-object: true
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true

# Chỉ mở /actuator/health (dùng cho Docker healthcheck), không lộ chi tiết thành phần.
# Redis cache và SMTP là tùy chọn (app vẫn chạy khi thiếu) nên không làm health DOWN.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
    mail:
      enabled: false

authorization:
  management:
    permission-code: ${AUTHORIZATION_MANAGEMENT_PERMISSION_CODE:AUTHORIZATION_MANAGE}

rate-limit:
  auth-max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
  sensitive-max-requests: ${SENSITIVE_RATE_LIMIT_MAX_REQUESTS:30}
  api-max-requests: ${API_RATE_LIMIT_MAX_REQUESTS:120}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  sensitive-paths: ${SENSITIVE_RATE_LIMIT_PATHS:/api/admin/}

redis:
  cache:
    enabled: ${REDIS_CACHE_ENABLED:false}
    key-prefix: ${REDIS_KEY_PREFIX:fs:local:v1:}
    default-ttl: ${REDIS_CACHE_DEFAULT_TTL:5m}
    active-modules-ttl: ${REDIS_CACHE_ACTIVE_MODULES_TTL:10m}
    authorization-catalog-ttl: ${REDIS_CACHE_AUTHORIZATION_CATALOG_TTL:5m}
    authorization-role-ttl: ${REDIS_CACHE_AUTHORIZATION_ROLE_TTL:2m}
    authorization-effective-permission-ttl: ${REDIS_CACHE_AUTHORIZATION_EFFECTIVE_PERMISSION_TTL:30s}
    authorization-user-assignment-ttl: ${REDIS_CACHE_AUTHORIZATION_USER_ASSIGNMENT_TTL:1m}
    catalog-ttl: ${REDIS_CACHE_CATALOG_TTL:10m}
    product-ttl: ${REDIS_CACHE_PRODUCT_TTL:5m}
    promotion-ttl: ${REDIS_CACHE_PROMOTION_TTL:1m}
    warning-interval: ${REDIS_CACHE_WARNING_INTERVAL:30s}
    scan-batch-size: ${REDIS_CACHE_SCAN_BATCH_SIZE:1000}

audit:
  spool:
    directory: ${AUDIT_SPOOL_DIRECTORY:./var/audit-spool}
    instance-id: ${AUDIT_INSTANCE_ID:${HOSTNAME:local}}
    zone-id: Asia/Saigon
  kafka:
    enabled: ${AUDIT_KAFKA_ENABLED:false}
    bootstrap-servers: ${AUDIT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${AUDIT_KAFKA_TOPIC:audit.events}
    consumer-group: ${AUDIT_KAFKA_CONSUMER_GROUP:fashion-audit-consumer}
    retry-attempts: ${AUDIT_KAFKA_RETRY_ATTEMPTS:2}
    retry-backoff-ms: ${AUDIT_KAFKA_RETRY_BACKOFF_MS:1000}

notification:
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
    bootstrap-servers: ${NOTIFICATION_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${NOTIFICATION_KAFKA_TOPIC:fashion.notifications}
    consumer-group: ${NOTIFICATION_KAFKA_CONSUMER_GROUP:fashion-notification-consumer}
    retry-attempts: ${NOTIFICATION_KAFKA_RETRY_ATTEMPTS:2}
    retry-backoff-ms: ${NOTIFICATION_KAFKA_RETRY_BACKOFF_MS:1000}

social-auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    issuer-uri: ${GOOGLE_ISSUER_URI:}

integrations:
  # Thanh toán online qua VNPay / MoMo (sandbox). Cổng nào thiếu khóa thì khách không chọn được cổng đó.
  payment:
    # Thời gian giữ hàng chờ khách thanh toán; quá hạn hệ thống tự hủy đơn.
    hold-minutes: ${PAYMENT_HOLD_MINUTES:15}
    expiry-check-ms: ${PAYMENT_EXPIRY_CHECK_MS:60000}
    # URL công khai của backend: dựng return URL và IPN URL gửi cho cổng (/api/webhooks/payments/{vnpay|momo}/...).
    callback-base-url: ${PAYMENT_CALLBACK_BASE_URL:http://localhost:8080}
    # Trang kết quả thanh toán của frontend; return URL chuyển khách tới đây kèm ?status=&orderId=&orderCode=.
    result-url: ${PAYMENT_RESULT_URL:}
    timeout-seconds: ${PAYMENT_TIMEOUT_SECONDS:15}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    momo:
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      api-base-url: ${MOMO_API_BASE_URL:https://test-payment.momo.vn}
  shipping:
    enabled: ${SHIPPING_ENABLED:false}
    provider: ${SHIPPING_PROVIDER:}
    api-base-url: ${SHIPPING_API_BASE_URL:}
    api-token: ${SHIPPING_API_TOKEN:}
    client-id: ${SHIPPING_CLIENT_ID:}
    client-secret: ${SHIPPING_CLIENT_SECRET:}
    shop-id: ${SHIPPING_SHOP_ID:}
    webhook-secret: ${SHIPPING_WEBHOOK_SECRET:}
    webhook-url: ${SHIPPING_WEBHOOK_URL:}
    timeout-seconds: ${SHIPPING_TIMEOUT_SECONDS:30}
    # Lalamove API v3: client-id = API key, client-secret = API secret (Partner Portal).
    lalamove:
      market: ${LALAMOVE_MARKET:VN}
      language: ${LALAMOVE_LANGUAGE:vi_VN}
      service-type: ${LALAMOVE_SERVICE_TYPE:MOTORCYCLE}
    sender:
      name: ${SHIPPING_SENDER_NAME:}
      phone: ${SHIPPING_SENDER_PHONE:}
      address: ${SHIPPING_SENDER_ADDRESS:}
      province: ${SHIPPING_SENDER_PROVINCE:}
      district: ${SHIPPING_SENDER_DISTRICT:}
      ward: ${SHIPPING_SENDER_WARD:}
